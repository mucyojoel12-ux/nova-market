<!DOCTYPE html>
<html>

<head>

<title>Cart - Nova Market</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
Nova Market 🛒
</div>

<a href="index.html">
Home
</a>

</header>




<section class="products">


<h1>
My Shopping Cart 🛒
</h1>


<div id="cartItems"></div>


<h2>
Total: $<span id="total">0</span>
</h2>




<a href="checkout.html">

<button>
Checkout 💳
</button>





</section>




<script>


let cart =
JSON.parse(localStorage.getItem("cart")) || [];



let box =
document.getElementById("cartItems");


let total=0;



cart.forEach(item=>{


box.innerHTML += `

<div class="card">

<h3>${item.name}</h3>

<p>$${item.price}</p>

</div>

`;



total += item.price;


});



document.getElementById("total").innerHTML=total;


</script>



</body>

</html>
